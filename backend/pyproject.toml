[project]
name = "fleet-copilot"
version = "0.1.0"
description = "Evidence-backed fleet copilot"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1.3,<4",
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fleet_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Third-party: langsmith still calls asyncio.iscoroutinefunction (deprecated in Python 3.14).
    "ignore::DeprecationWarning:langsmith.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
